# Maven Wrapper 3.3.4, "only-script" distribution: no maven-wrapper.jar is committed to the
# repository. mvnw / mvnw.cmd download and cache Apache Maven under ~/.m2/wrapper/dists.
wrapperVersion=3.3.4
distributionType=only-script

# Apache Maven 3.9.16 (latest 3.9.x line).
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip

# Integrity pin. The wrapper aborts if the downloaded archive does not match this digest.
# Cross-checked against the SHA-1 published next to the artifact on Maven Central.
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
