# IntelliJ'de feature/senaryo yanindaki yesil butona basildiginda test JUnit runner ile degil
# io.cucumber.core.cli.Main ile kosar; o kosum junit-platform.properties'i okumaz.
# Glue verilmezse Cucumber varsayilan olarak "classpath:/" tarar, yani tum jar'lari da gezer ve
# byte-buddy'nin opsiyonel JNA siniflarinda NoClassDefFoundError uyarilari basar.
# Asagidaki satir taramayi kendi step paketlerimizle sinirlar; uyarilar kalkar, kosum hizlanir.
# Deger junit-platform.properties icindekiyle ayni tutulmalidir.
cucumber.glue=com.commencis.stepdefinitions,com.commencis.hooks

# Kosum sonundaki "Share your Cucumber Report" reklamini bastirir.
cucumber.publish.quiet=true
