# Ortam ve cihaz bagimsiz varsayilanlar.
# Cozumleme sirasi: -D > ortam degiskeni > config/device/<device>.properties
#                   > config/env/<environment>.properties > bu dosya

# Hangi katman dosyalarinin yuklenecegini belirler; -Denvironment=prep -Ddevice=android-real ile ezilir.
environment=test
device=android-emulator

# Mobile
mobile.platform=android
mobile.explicit.wait.seconds=15
appium.server.url=http://127.0.0.1:4723

# API
api.timeout.seconds=20
# Rest Assured'in kendi konsol log'u. Maskeleme YOKTUR: acilirsa ham govde stdout'a ve oradan
# failsafe-reports XML'ine duser. Rapor icin gerekmez; Allure eki zaten maskelenmis govdeyi tasir.
# Yalnizca elle hata ayiklarken acilir: -Dapi.log.response=true
api.log.request=false
api.log.response=false

# Katman sirasini dogrulayan test anahtari (frameworktest/ConfigTest).
config.layer=defaults
