# Gercek Android cihaz. -Ddevice=android-real
# UDID cihaza ozeldir: adb devices -l cikisindaki seri numarasi yazilir veya -Dandroid.udid=... verilir.

android.automation.name=UiAutomator2
android.udid=
android.device.name=
android.platform.version=

# Gercek cihazda uygulama genellikle kurulu gelir; o zaman package/activity kullanilir.
