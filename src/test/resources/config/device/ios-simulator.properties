# iOS simulator. -Ddevice=ios-simulator -Dmobile.platform=ios
# XCUITest calistiran Appium server macOS + Xcode gerektirir; appium.server.url uzak bir mac olabilir.
# Cihaz listesi: xcrun xctrace list devices

ios.automation.name=XCUITest
ios.udid=
ios.device.name=
ios.platform.version=

# Doluysa uygulama kurulur; bos birakilirsa cihazdaki uygulama bundleId ile acilir.
ios.app.path=
ios.bundle.id=

ios.no.reset=false
ios.new.command.timeout=120
