# Cucumber JUnit Platform Engine yapilandirmasi.
# Buradaki her deger -D ile ezilebilir; -D onceliklidir.
# cucumber.features tanimlanmaz: feature secimi CucumberRunnerTest'teki
# @SelectClasspathResource ile yapilir, ikisi birlikte kullanilirsa senaryolar iki kez kosar.

# Glue dar tutulur: yalnizca Cucumber annotation'i tasiyan paketler taranir.
# context paketi burada yok; PicoContainer onlari constructor bagimliligi olarak cozer.
# stepdefinition alt paketleri (api, mobile) de kapsanir, ayrica yazmaya gerek yoktur.
cucumber.glue=com.commencis.interview.hooks,com.commencis.interview.stepdefinition

# Varsayilan kosum cihaz gerektirmesin diye yalnizca API senaryolari secilir.
# Mobil kosum: -Dcucumber.filter.tags="@mobile and @smoke"
# ./mvnw.cmd clean verify -Pcucumber "-Dcucumber.filter.tags=@api and @smoke"

cucumber.filter.tags=@api and @smoke

cucumber.plugin=pretty, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.publish.quiet=true
cucumber.execution.parallel.enabled=false
cucumber.junit-platform.naming-strategy=long
