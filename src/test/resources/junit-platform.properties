# Cucumber JUnit Platform Engine ayarlari. Her deger -D ile ezilebilir.
# cucumber.features tanimlanmaz: feature secimi CucumberRunnerTest'teki @SelectPackages ile
# yapilir, ikisi birlikte kullanilirsa ayni senaryo iki kez kosar.

# Glue: yalnizca Cucumber annotation.i tasiyan paketler taranir. Alt paketler (stepdefinitions.api,
# stepdefinitions.mobile) kok paket uzerinden bulunur, ayri ayri yazilmaz.
# core, mobile ve api burada yok; PicoContainer onlari constructor bagimliligi olarak cozer.
cucumber.glue=com.commencis.interview.stepdefinitions,com.commencis.interview.hooks

# Varsayilan kosum cihaz gerektirmesin diye yalnizca API senaryolari secilir.
# Mobil kosum: .\mvnw.cmd clean verify "-Dcucumber.filter.tags=@mobile"
cucumber.filter.tags=@api

cucumber.plugin=pretty, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.publish.quiet=true
cucumber.execution.parallel.enabled=false
cucumber.junit-platform.naming-strategy=long
