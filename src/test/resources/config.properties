# Testin hangi ortam/cihaz/endpoint uzerinde calisacagini bu dosya belirler.
# Oncelik: -Dkey=deger > environment variable (KEY_ALT_CIZGI) > bu dosya.
# Buraya gercek token/secret yazmayin.

# Mobile
mobile.platform=android
appium.server.url=http://127.0.0.1:4723
mobile.explicit.wait.seconds=15

# Android
android.automation.name=UiAutomator2
android.udid=
android.device.name=
android.platform.version=
android.app.path=
android.app.package=io.appium.android.apis
android.app.activity=.ApiDemos
# Opsiyonel: uygulama farkli bir package/activity ile aciliyorsa Appium'un neyi bekleyecegi.
android.app.wait.package=
android.app.wait.activity=
android.no.reset=false
android.auto.grant.permissions=true
android.new.command.timeout=120

# iOS - XCUITest calistiran Appium server macOS + Xcode gerektirir.
# appium.server.url uzaktaki bir macOS makineyi gosterebilir; istemcinin isletim sistemi engel degildir.
ios.automation.name=XCUITest
ios.udid=
ios.device.name=
ios.platform.version=
ios.app.path=
ios.bundle.id=
ios.no.reset=false
ios.new.command.timeout=120

# API
api.base.url=https://jsonplaceholder.typicode.com
api.auth.token=
api.timeout.seconds=20
