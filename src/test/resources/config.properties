# Mobile ortak ayarlar
platform=android
# Appium server adresi. Proje server baslatmaz; once appium.cmd calismali.
appium.url=http://127.0.0.1:4723
# Elementlerin gorunur/tiklanabilir olmasi icin beklenecek en fazla sure (saniye).
element.timeout=15
# Driver'a yeni komut gelmezse Appium session'in kapanacagi sure (saniye). Android/iOS ortaktir.
appium.command.timeout=120

# ---------------------------------------------------------------------
# --- Android ---

# Automation name UiAutomator2Options tarafindan "UiAutomator2" olarak ayarlanir; ayri key gerekmez.
# ADB seri numarasi. Bagli cihazlari `adb devices -l` ile gorun; bu projede zorunludur.
android.udid=emulator-5554
# Appium'da gorunecek cihaz adi. UDID verildigi icin bos birakilabilir.
android.device.name=
# Android surumu. Appium cihazdan otomatik algilayabiliyorsa bos birakilabilir.
android.platform.version=
# Kurulacak APK yolu. Bos ise uygulama package/activity ile cihazda acilir.
android.app=C:/Users/bartu/Downloads/ApiDemos-debug.apk
# android.app bosken acilacak kurulu uygulamanin package ve baslangic activity degerleri.
android.app.package=io.appium.android.apis
android.app.activity=.ApiDemos
# Acilis tamamlanirken beklenecek package/activity. Ozel splash veya yonlendirme yoksa bos kalabilir.
android.app.wait.package=
android.app.wait.activity=
# true uygulama verisini korur; false Appium'un temiz session davranisina izin verir.
android.no.reset=false
# Android runtime izinlerini session basinda otomatik verir.
android.auto.grant.permissions=true

# ---------------------------------------------------------------------
# --- iOS ---

# cihaz listesi: xcrun xctrace list devices
# ios.app doluysa uygulama kurulur; bos ise cihazdaki uygulama bundle id ile acilir.
ios.udid=
ios.device.name=
ios.platform.version=
ios.app=
ios.bundle.id=
ios.no.reset=false

# ---------------------------------------------------------------------
# --- API ---

# Bos birakilirsa senaryoda/testte full URL verilir; ikisi birlikte de calisir.
api.base.url=https://jsonplaceholder.typicode.com
api.timeout=20
# Secret repository'ye yazilmaz: -Dapi.token=... veya API_TOKEN ile gecilir.
api.token=
# Ham istek/yaniti konsola basar. MASKELEME YOKTUR; rapor icin gerekmez,
# yalnizca elle hata ayiklarken acilir.
api.log=false
# ---------------------------------------------------------------------
# Set-up
# ---------------------------------------------------------------------

# Emulator listesindeki cihazları görmek için    ->  emulator -list-avds
# Emulatoru seçilmiş olan cihaz ile açmak için   ->  emulator -avd Pixel8_API35
# Appium server’ı Inspector ile başlatmak için   ->  appium.cmd --use-plugins=inspector
# Package ve activity değerlerini öğrenmek için  ->  adb shell dumpsys window | sls mCurrentFocus
# Server ayakta mı kontrol etmek için            ->  Invoke-RestMethod http://127.0.0.1:4723/status
# Inspector webte açmak için                     ->  http://localhost:4723/inspector  /  http://127.0.0.1:4723/inspector
# Inspector Remote Host için                     ->  localhost  /  127.0.0.1  (yukarıda linkte hangisini girdiysen)
# Inspector Remote Port ve Path için             ->  Port: 4723  Path: /

# Appium açıksa 4723 portunu kill etmek için     -> Get-NetTCPConnection -LocalPort 4723 -State Listen | Select-Object -ExpandProperty OwningProcess -Unique | ForEach-Object { Stop-Process -Id $_ -Force }
# Appium Açık portu bulmak için                  -> Get-Process -Id (Get-NetTCPConnection -LocalPort 4723 -State Listen).OwningProcess


