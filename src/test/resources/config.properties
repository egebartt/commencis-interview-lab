# -------------------------------------------------------------------

# platform               = android veya ios. Hem driver'i hem platforma bagli locator secimini belirler.
# appium.url             = Appium server adresi. Proje server baslatmaz; once appium.cmd calismali.
# element.timeout        = Elementin gorunur/tiklanabilir olmasi icin beklenecek en fazla sure (saniye).
# appium.command.timeout = Driver'a yeni komut gelmezse session'in kapanacagi sure (saniye). Android/iOS ortak.

# android.udid                   = ADB seri numarasi. Bagli cihazlari `adb devices -l` ile gorun; zorunludur.
# android.device.name            = Appium'da gorunecek cihaz adi. UDID verildigi icin bos birakilabilir.
# android.platform.version       = Android surumu. Appium cihazdan algilayabiliyorsa bos birakilabilir.
# android.app                    = Kurulacak APK yolu. Bos ise uygulama package/activity ile cihazda acilir.
# android.app.package            = android.app bosken acilacak kurulu uygulamanin package degeri.
# android.app.activity           = Ayni durumda acilacak baslangic activity degeri.
# android.app.wait.package       = Acilis tamamlanirken beklenecek package. Splash/yonlendirme yoksa bos kalir.
# android.app.wait.activity      = Ayni amacla beklenecek activity.
# android.no.reset               = true uygulama verisini korur; false Appium'un temiz session davranisina izin verir.
# android.auto.grant.permissions = Android runtime izinlerini session basinda otomatik verir.
#
# Automation name UiAutomator2Options tarafindan "UiAutomator2" olarak ayarlanir; ayri key gerekmez.

# ios.udid             = Cihaz UDID'si. Listelemek icin: xcrun xctrace list devices
# ios.device.name      = Appium'da gorunecek cihaz adi. UDID verildigi icin bos birakilabilir.
# ios.platform.version = iOS surumu. Appium cihazdan algilayabiliyorsa bos birakilabilir.
# ios.app              = Kurulacak uygulama yolu. Bos ise cihazdaki uygulama bundle id ile acilir.
# ios.bundle.id        = ios.app bosken acilacak kurulu uygulamanin bundle id degeri.
# ios.no.reset         = true uygulama verisini korur; false temiz session davranisina izin verir.

# api.base.url = Bos birakilirsa senaryoda/testte full URL verilir; ikisi birlikte de calisir.
# api.timeout  = Baglanti/okuma zaman asimi (saniye).
# api.token    = Secret repository'ye yazilmaz: -Dapi.token=... veya API_TOKEN ile gecilir.
