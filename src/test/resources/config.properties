# Emulator listesindeki cihazları görmek için    ->  emulator -list-avds
# Emulatoru seçilmiş olan cihaz ile açmak için   ->  emulator -avd Pixel8_API35
# Appium server’ı Inspector ile başlatmak için   ->  appium.cmd --use-plugins=inspector
# Package ve activity değerlerini öğrenmek için  ->  adb shell dumpsys window | sls mCurrentFocus
# Server ayakta mı kontrol etmek için            ->  Invoke-RestMethod http://127.0.0.1:4723/status
# Inspector webte açmak için                     ->  http://localhost:4723/inspector


# android.automation.name=          Kullanılacak Android otomasyon driver'ı.
# android.udid=                     Testin çalışacağı cihazın ADB seri numarası.
# android.device.name=              Cihaz adı; UDID kullanılıyorsa boş bırakılabilir.
# android.platform.version=         Android sürümü; otomatik algılanması için boş bırakılabilir.
# android.app.path=                 Kurulacak APK yolu; uygulama zaten kuruluysa boş bırakılır.
# android.app.package=              Cihazda kurulu uygulamanın package adı.
# android.app.activity=             Uygulamanın başlangıç activity’si.
# android.app.wait.package=         Açılışta beklenecek package; gerekmedikçe boş bırakılır.
# android.app.wait.activity=        Açılışta beklenecek activity; gerekmedikçe boş bırakılır.
# android.no.reset=                 true ise uygulama verileri korunur, false ise reset davranışına izin verilir.
# android.auto.grant.permissions=   Android runtime izinlerini otomatik olarak verir.
# android.new.command.timeout=      Komut gelmezse session’ın kapatılacağı süre (saniye).


