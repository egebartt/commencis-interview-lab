# AppiumBy.accessibilityId()	    -> content-desc   (id kadar iyi)
# AppiumBy.androidUIAutomator()	    -> text  	      (kesinlikle öğren)
# AppiumBy.className()		        -> class 	      (tek başına pek kullanma)
# AppiumBy.xpath()		            -> xpath 	      (son çare)


